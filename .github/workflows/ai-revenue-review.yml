name: AI Revenue Review

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Use the committed KPI fixture and skip OpenAI
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-revenue-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-company
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FLORALOG_AI_MODEL: ${{ vars.FLORALOG_AI_MODEL || 'openai/gpt-5-mini' }}
      AI_KPI_ENDPOINT: ${{ secrets.AI_KPI_ENDPOINT }}
      AI_KPI_SECRET: ${{ secrets.AI_KPI_SECRET }}
      AI_MONTHLY_COST_EUR: ${{ vars.AI_MONTHLY_COST_EUR || '0' }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: ai-company/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Select KPI input
        shell: bash
        run: |
          mkdir -p output
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            cp fixtures/kpi_snapshot.json output/kpi-snapshot.json
          else
            test -n "$AI_KPI_ENDPOINT" || { echo "AI_KPI_ENDPOINT is not configured"; exit 1; }
            test -n "$AI_KPI_SECRET" || { echo "AI_KPI_SECRET is not configured"; exit 1; }
            test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is not configured"; exit 1; }
            uv run floralog-ai-fetch-snapshot --output output/kpi-snapshot.json
          fi

      - name: Run revenue review
        shell: bash
        run: |
          LIVE_FLAG=""
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.dry_run }}" != "true" ]]; then
            LIVE_FLAG="--live"
          fi
          uv run floralog-ai \
            --snapshot output/kpi-snapshot.json \
            --output output/revenue-review.json \
            --monthly-cost "$AI_MONTHLY_COST_EUR" \
            $LIVE_FLAG
          uv run floralog-ai-render-issue \
            --review output/revenue-review.json \
            --output output/revenue-review.md

      - name: Create or update review issue
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          gh label create ai-revenue-review --color 2DA44E --description "Automated Floralog revenue review" --force
          ISSUE_NUMBER=$(gh issue list --state open --label ai-revenue-review --json number --jq '.[0].number // empty')
          TITLE="AI Revenue Review - $(date -u +%Y-%m-%d)"
          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh issue edit "$ISSUE_NUMBER" --title "$TITLE" --body-file ai-company/output/revenue-review.md
          else
            gh issue create --title "$TITLE" --body-file ai-company/output/revenue-review.md --label ai-revenue-review
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-revenue-review-${{ github.run_id }}
          path: ai-company/output/
          if-no-files-found: warn
          retention-days: 30
