name: Admin Weekly Report Instagram

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Render fixture slides only; do not access Supabase or Instagram
        required: true
        type: boolean
        default: true
      week_start:
        description: Optional Monday date (YYYY-MM-DD) for a live snapshot
        required: false
        type: string
        default: ""
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

concurrency:
  group: admin-weekly-report-instagram
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-company
    env:
      AI_KPI_SECRET: ${{ secrets.AI_KPI_SECRET }}
      WEEKLY_REPORT_SNAPSHOT_ENDPOINT: https://mppxozsltkgjozcastgv.supabase.co/functions/v1/adminWeeklyReportSnapshot
      AI_MEDIA_UPLOAD_ENDPOINT: https://mppxozsltkgjozcastgv.supabase.co/functions/v1/aiSocialMediaUpload
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_API_MODE: instagram_login
      INSTAGRAM_GRAPH_VERSION: v25.0
      INSTAGRAM_AI_LABEL: "false"
      FLORALOG_WEEKLY_REPORT_POSTING_ENABLED: ${{ vars.FLORALOG_WEEKLY_REPORT_POSTING_ENABLED || 'false' }}
      IS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      WEEK_START: ${{ inputs.week_start }}
      SHOULD_PUBLISH: ${{ github.event_name == 'schedule' && github.run_attempt == 1 && vars.FLORALOG_WEEKLY_REPORT_POSTING_ENABLED == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: ai-company/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Render and optionally publish weekly report
        shell: bash
        run: |
          mkdir -p output/weekly-report
          if [[ "$IS_DRY_RUN" == "true" ]]; then
            uv run python -m floralog_ai.weekly_report_main \
              --snapshot fixtures/weekly_report_snapshot.json
          else
            test -n "$AI_KPI_SECRET" || { echo "AI_KPI_SECRET is not configured"; exit 1; }
            ARGS=()
            if [[ -n "$WEEK_START" ]]; then
              ARGS+=(--week-start "$WEEK_START")
            fi
            if [[ "$SHOULD_PUBLISH" == "true" ]]; then
              test -n "$INSTAGRAM_USER_ID" || { echo "INSTAGRAM_USER_ID is not configured"; exit 1; }
              test -n "$INSTAGRAM_ACCESS_TOKEN" || { echo "INSTAGRAM_ACCESS_TOKEN is not configured"; exit 1; }
              ARGS+=(--publish)
            fi
            uv run python -m floralog_ai.weekly_report_main "${ARGS[@]}"
          fi
          cat output/weekly-report/result.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-weekly-report-${{ github.run_id }}
          path: ai-company/output/weekly-report/
          if-no-files-found: warn
          retention-days: 7
