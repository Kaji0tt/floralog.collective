name: AI Reach Agent

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Use committed fixtures, skip OpenAI and social networks
        required: true
        type: boolean
        default: false
      publish:
        description: Publish approved posts (also requires FLORALOG_REACH_POSTING_ENABLED=true)
        required: true
        type: boolean
        default: false
      task:
        description: Which part of the agent to run
        required: true
        type: choice
        options: [posts, partners]
        default: posts
  schedule:
    - cron: "23 16 * * 1,3,5"
    - cron: "7 9 * * 1"

permissions:
  contents: read

concurrency:
  group: ai-reach-agent
  cancel-in-progress: false

jobs:
  reach:
    if: github.event.schedule == '23 16 * * 1,3,5' || (github.event_name == 'workflow_dispatch' && inputs.task == 'posts')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-company
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FLORALOG_AI_MODEL: ${{ vars.FLORALOG_AI_MODEL || 'openai/gpt-5-mini' }}
      AI_CONTENT_ENDPOINT: ${{ secrets.AI_CONTENT_ENDPOINT }}
      AI_KPI_ENDPOINT: ${{ secrets.AI_KPI_ENDPOINT }}
      AI_KPI_SECRET: ${{ secrets.AI_KPI_SECRET }}
      AI_MONTHLY_COST_EUR: ${{ vars.AI_MONTHLY_COST_EUR || '0' }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_AI_LABEL: ${{ vars.INSTAGRAM_AI_LABEL || 'true' }}
      PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
      PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
      PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
      PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
      AI_MEDIA_UPLOAD_ENDPOINT: ${{ secrets.AI_MEDIA_UPLOAD_ENDPOINT }}
      FLORALOG_REACH_POSTING_ENABLED: ${{ vars.FLORALOG_REACH_POSTING_ENABLED || 'false' }}
      IS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      SHOULD_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: ai-company/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Run reach agent
        shell: bash
        run: |
          mkdir -p output
          if [[ "$IS_DRY_RUN" == "true" ]]; then
            uv run floralog-ai-reach \
              --content-snapshot fixtures/content_snapshot.json \
              --history fixtures/social_history.json
          else
            test -n "$AI_CONTENT_ENDPOINT" || { echo "AI_CONTENT_ENDPOINT is not configured"; exit 1; }
            test -n "$AI_KPI_SECRET" || { echo "AI_KPI_SECRET is not configured"; exit 1; }
            test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is not configured"; exit 1; }
            uv run floralog-ai-fetch-content --output output/content-snapshot.json
            PUBLISH_FLAG=""
            if [[ "$SHOULD_PUBLISH" == "true" ]]; then
              PUBLISH_FLAG="--publish"
            fi
            uv run floralog-ai-reach \
              --content-snapshot output/content-snapshot.json \
              --monthly-cost "$AI_MONTHLY_COST_EUR" \
              --live $PUBLISH_FLAG
          fi
          cat output/reach-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-reach-report-${{ github.run_id }}
          path: ai-company/output/
          if-no-files-found: warn
          retention-days: 90

  partners:
    if: github.event.schedule == '7 9 * * 1' || (github.event_name == 'workflow_dispatch' && inputs.task == 'partners')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: ai-company
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FLORALOG_AI_MODEL: ${{ vars.FLORALOG_AI_MODEL || 'openai/gpt-5-mini' }}
      AI_MONTHLY_COST_EUR: ${{ vars.AI_MONTHLY_COST_EUR || '0' }}
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_HASHTAG_SEARCH: ${{ vars.INSTAGRAM_HASHTAG_SEARCH || 'false' }}
      IS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: ai-company/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Scout partners
        shell: bash
        run: |
          mkdir -p output
          if [[ "$IS_DRY_RUN" == "true" ]]; then
            uv run floralog-ai-partners --candidates fixtures/partner_candidates.json
          else
            test -n "$OPENAI_API_KEY" || { echo "OPENAI_API_KEY is not configured"; exit 1; }
            uv run floralog-ai-partners --live --monthly-cost "$AI_MONTHLY_COST_EUR"
          fi
          cat output/partner-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update scouting issue
        if: env.IS_DRY_RUN != 'true'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          gh label create ai-partner-scouting --color 0E8A16 --description "Automated Floralog partner scouting" --force
          ISSUE_NUMBER=$(gh issue list --state open --label ai-partner-scouting --json number --jq '.[0].number // empty')
          TITLE="AI Partner Scouting - $(date -u +%Y-%m-%d)"
          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh issue edit "$ISSUE_NUMBER" --title "$TITLE" --body-file ai-company/output/partner-report.md
          else
            gh issue create --title "$TITLE" --body-file ai-company/output/partner-report.md --label ai-partner-scouting
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-partner-report-${{ github.run_id }}
          path: ai-company/output/
          if-no-files-found: warn
          retention-days: 30
