[project]
name = "floralog-ai-company"
version = "0.1.0"
description = "Guardrailed CrewAI workflows for Floralog product and revenue decisions."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai==1.15.22",
]

[project.scripts]
floralog-ai = "floralog_ai.main:main"
floralog-ai-fetch-snapshot = "floralog_ai.snapshot_client:main"
floralog-ai-render-issue = "floralog_ai.issue_renderer:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floralog_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
