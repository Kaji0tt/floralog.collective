<!DOCTYPE html>
<html>
<head>
    <title>Referral Code Test</title>
</head>
<body>
    <h1>Referral Code Dekodierung Test</h1>
    <div id="output" style="font-family: monospace; white-space: pre; background: #f0f0f0; padding: 10px;">
        Loading...
    </div>

    <script>
        const REFERRAL_CODE_SALT = "floralog-referral-v1";

        function toBase64Url(bytes) {
            let binary = "";
            for (const byte of bytes) {
                binary += String.fromCharCode(byte);
            }
            return window.btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
        }

        function fromBase64Url(value) {
            const normalized = String(value || "").replace(/-/g, "+").replace(/_/g, "/");
            const paddingLength = (4 - (normalized.length % 4 || 4)) % 4;
            const padded = normalized + "=".repeat(paddingLength);
            const binary = window.atob(padded);
            return Uint8Array.from(binary, (character) => character.charCodeAt(0));
        }

        function scrambleBytes(bytes) {
            const saltBytes = new TextEncoder().encode(REFERRAL_CODE_SALT);
            return bytes.map((byte, index) => byte ^ saltBytes[index % saltBytes.length] ^ ((index * 31 + 17) & 0xff));
        }

        function decodeReferralCode(referralCode) {
            if (!referralCode) return null;
            try {
                const decodedBytes = fromBase64Url(referralCode);
                const plainText = new TextDecoder().decode(scrambleBytes(decodedBytes)).trim().toLowerCase();
                return plainText.includes("@") ? plainText : null;
            } catch (err) {
                console.error('decodeReferralCode error:', err);
                return null;
            }
        }

        const testCode = "HD1Kddy00M1DNU1njLPc4gRhZwx0nQ";
        const decodedEmail = decodeReferralCode(testCode);

        const output = document.getElementById('output');
        output.textContent = `Test Referral Code: ${testCode}
Dekodiert zu Email: ${decodedEmail || 'FEHLER - konnte nicht dekodieren'}

--- Debug Info ---`;

        // Weitere Debug-Informationen
        try {
            const decodedBytes = fromBase64Url(testCode);
            output.textContent += `\n\nBase64-dekodiert (${decodedBytes.length} bytes):
${Array.from(decodedBytes).map(b => b.toString(16).padStart(2, '0')).join(' ')}`;

            const unscrambled = scrambleBytes(decodedBytes);
            output.textContent += `\n\nNach Unscrambling:
${Array.from(unscrambled).map(b => String.fromCharCode(b)).join('')}`;

            try {
                const decoded = new TextDecoder().decode(unscrambled);
                output.textContent += `\n\nAls Text: "${decoded}"`;
                output.textContent += `\n\nTrim + Lowercase: "${decoded.trim().toLowerCase()}"`;
            } catch (e) {
                output.textContent += `\n\nTextDecoder Error: ${e.message}`;
            }
        } catch (e) {
            output.textContent += `\n\nError: ${e.message}`;
        }

        console.log('Test result:', decodedEmail);
    </script>
</body>
</html>
