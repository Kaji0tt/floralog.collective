apply plugin: 'com.android.application'

// ── Auto-increment versionCode + versionName patch from version.properties ──
def versionPropsFile = rootProject.file('version.properties')
def defaultVersionProps = 'VERSION_CODE=1\nVERSION_NAME_BASE=0.1\nVERSION_NAME_PATCH=0\nVERSION_NAME=0.1.0\n'
if (!versionPropsFile.exists() || !versionPropsFile.text.trim()) {
    versionPropsFile.text = defaultVersionProps
}
def versionProps = new Properties()
versionPropsFile.withInputStream { versionProps.load(it) }

def versionPropsDirty = false
def ensureProperty = { String key, String value ->
    def current = versionProps.getProperty(key)
    if (current == null || current != value) {
        versionProps.setProperty(key, value)
        versionPropsDirty = true
    }
}

def readIntProperty = { String key, int fallback ->
    def raw = versionProps.getProperty(key)
    if (raw == null || raw.trim().isEmpty()) {
        ensureProperty(key, String.valueOf(fallback))
        return fallback
    }
    try {
        return Integer.parseInt(raw.trim())
    } catch (Exception ignored) {
        ensureProperty(key, String.valueOf(fallback))
        return fallback
    }
}

def autoVersionCode = readIntProperty('VERSION_CODE', 1)
def versionNameBase = (versionProps.getProperty('VERSION_NAME_BASE', '0.1') ?: '0.1').trim()
if (!versionNameBase) {
    versionNameBase = '0.1'
}
ensureProperty('VERSION_NAME_BASE', versionNameBase)

def versionNamePatch = readIntProperty('VERSION_NAME_PATCH', 0)
def autoVersionName = versionProps.getProperty('VERSION_NAME', "${versionNameBase}.${versionNamePatch}").toString()
if (!autoVersionName.trim()) {
    autoVersionName = "${versionNameBase}.${versionNamePatch}".toString()
}

ensureProperty('VERSION_CODE', String.valueOf(autoVersionCode))
ensureProperty('VERSION_NAME_PATCH', String.valueOf(versionNamePatch))
ensureProperty('VERSION_NAME', autoVersionName)
if (versionPropsDirty) {
    versionPropsFile.withOutputStream { versionProps.store(it, null) }
}

// Nur bei Release-Builds hochzählen (nicht bei jedem Debug-Build)
gradle.taskGraph.whenReady { taskGraph ->
    def isRelease = taskGraph.allTasks.any { it.name.contains('Release') }
    if (isRelease) {
        autoVersionCode += 1
        versionNamePatch += 1
        autoVersionName = "${versionNameBase}.${versionNamePatch}".toString()
        versionProps.setProperty('VERSION_CODE', autoVersionCode.toString())
        versionProps.setProperty('VERSION_NAME_BASE', versionNameBase)
        versionProps.setProperty('VERSION_NAME_PATCH', versionNamePatch.toString())
        versionProps.setProperty('VERSION_NAME', autoVersionName)
        versionPropsFile.withOutputStream { versionProps.store(it, null) }
        println ">>> Auto-versioned release: versionName=${autoVersionName}, versionCode=${autoVersionCode}"
    }
}
// ──────────────────────────────────────────────────────────────────────────

android {
    namespace = "de.floralog.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.floralog.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode autoVersionCode
        versionName autoVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        if (variant.buildType.name == 'release') {
            variant.outputs.all { output ->
                outputFileName = "floralog-v${variant.versionName}-code${variant.versionCode}.apk".toString()
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
